packages:
  - apps/*
  - packages/*
  - template

# インストール時のスクリプトの実行を許可する依存（pnpm 11 以降は、ここに無いものはエラーになる）
allowBuilds:
  core-js: true
  unrs-resolver: true

catalog:
  # React関連
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0

  # UI関連
  '@mui/material': 9.5.0
  '@mui/icons-material': 9.5.0
  '@emotion/react': 11.14.0
  '@emotion/styled': 11.14.1
  notistack: 3.0.2

  # フォーム関連
  'react-hook-form': 7.92.0
  '@hookform/resolvers': 7.0.8
  zod: 4.6.7

  # DnD関連
  '@dnd-kit/core': 6.3.1
  '@dnd-kit/sortable': 10.0.0
  '@dnd-kit/utilities': 3.2.2

  # Kintone関連
  '@kintone/rest-api-client': 7.0.1
  '@kintone/dts-gen': 10.0.0
  '@kintone/cli': 1.22.6

  # 状態管理
  jotai: 3.0.2

  # ユーティリティ
  nanoid: 6.0.2
  'react-error-boundary': 6.1.6

  # ビルドツール
  '@rsbuild/core': 2.3.3
  '@rsbuild/plugin-react': 2.1.1
  '@rsbuild/plugin-type-check': 1.6.1

  # 開発ツール
  '@biomejs/biome': 2.6.8
  typescript: 7.0.2
  vitest: 5.1.1
  'cross-env': 10.1.0
  'fs-extra': 11.4.1
  rimraf: 6.1.4
  turbo: 2.11.13
  'npm-run-all': 4.1.5
  '@clack/prompts': 1.9.0
